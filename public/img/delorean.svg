<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230">
  <defs>
    <linearGradient id="acero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset=".45" stop-color="#c3c9cf"/>
      <stop offset="1" stop-color="#8d969f"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6a86"/>
      <stop offset=".5" stop-color="#1d2b3a"/>
      <stop offset="1" stop-color="#0f1822"/>
    </linearGradient>
    <linearGradient id="fuego" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a00" stop-opacity="0"/>
      <stop offset=".55" stop-color="#ff7a00" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <linearGradient id="estela" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bfeaff" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="llanta" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e3e7eb"/>
      <stop offset=".7" stop-color="#9aa2aa"/>
      <stop offset="1" stop-color="#5d656d"/>
    </radialGradient>
    <filter id="brillo" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- estelas de fuego en el piso (el auto va hacia la derecha) -->
  <rect x="0" y="196" width="470" height="9" rx="4.5" fill="url(#fuego)" filter="url(#brillo)"/>
  <rect x="40" y="198" width="430" height="5" rx="2.5" fill="url(#fuego)"/>
  <rect x="200" y="196" width="575" height="7" rx="3.5" fill="url(#fuego)" opacity=".8"/>
  <!-- lineas de velocidad -->
  <rect x="60" y="92" width="190" height="3" rx="1.5" fill="url(#estela)"/>
  <rect x="20" y="128" width="240" height="3" rx="1.5" fill="url(#estela)"/>
  <rect x="90" y="160" width="160" height="3" rx="1.5" fill="url(#estela)"/>

  <g transform="translate(270,0)">
    <!-- carroceria en cuña -->
    <path d="M58,112 L208,100 L300,62 L380,60 L452,100 L598,118 L606,124 L606,156 L56,162 Z" fill="url(#acero)" stroke="#5b636b" stroke-width="2" stroke-linejoin="round"/>
    <!-- parte baja negra -->
    <path d="M56,140 L606,134 L606,156 L56,162 Z" fill="#2b3036"/>
    <!-- ventanilla lateral -->
    <path d="M298,72 L374,70 L432,101 L246,101 Z" fill="url(#vidrio)" stroke="#3a434c" stroke-width="1.5"/>
    <path d="M312,74 L340,73 L300,99 L278,99 Z" fill="#ffffff" opacity=".18"/>
    <!-- persianas de la luneta -->
    <g stroke="#3d454d" stroke-width="3" stroke-linecap="round">
      <line x1="222" y1="98" x2="236" y2="92"/>
      <line x1="238" y1="91" x2="252" y2="85"/>
      <line x1="254" y1="84" x2="268" y2="78"/>
      <line x1="270" y1="77" x2="284" y2="71"/>
    </g>
    <!-- linea de la puerta "ala de gaviota" -->
    <path d="M244,103 L456,104 L452,140 L250,142 Z" fill="none" stroke="#7a838c" stroke-width="1.5"/>
    <rect x="420" y="110" width="22" height="4" rx="2" fill="#5b636b"/>
    <!-- faro y luz trasera -->
    <rect x="584" y="122" width="18" height="8" rx="2" fill="#fff6c9"/>
    <rect x="58" y="116" width="10" height="16" rx="2" fill="#c8312a"/>
    <!-- arcos de rueda -->
    <circle cx="170" cy="164" r="40" fill="#1a1d21"/>
    <circle cx="490" cy="164" r="40" fill="#1a1d21"/>
    <path d="M56,162 L130,161 M210,160 L450,158 M530,157 L606,156" stroke="#2b3036" stroke-width="2"/>
    <!-- ruedas -->
    <circle cx="170" cy="170" r="32" fill="#16181b"/>
    <circle cx="170" cy="170" r="19" fill="url(#llanta)"/>
    <circle cx="170" cy="170" r="5" fill="#4a5158"/>
    <circle cx="490" cy="170" r="32" fill="#16181b"/>
    <circle cx="490" cy="170" r="19" fill="url(#llanta)"/>
    <circle cx="490" cy="170" r="5" fill="#4a5158"/>
    <!-- chispas azules del condensador -->
    <g stroke="#8fe3ff" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#brillo)">
      <path d="M140,108 l-14,-12 l8,-2 l-12,-14"/>
      <path d="M330,56 l-6,-16 l8,2 l-4,-16"/>
      <path d="M560,112 l12,-14 l-8,-2 l10,-14"/>
    </g>
    <g stroke="#e6f9ff" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M140,108 l-14,-12 l8,-2 l-12,-14"/>
      <path d="M330,56 l-6,-16 l8,2 l-4,-16"/>
      <path d="M560,112 l12,-14 l-8,-2 l10,-14"/>
    </g>
  </g>
</svg>
